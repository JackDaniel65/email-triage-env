[project]
name = "email-triage-env"
version = "1.0.0"
description = "A real-world OpenEnv environment for AI email triage agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "groq>=0.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
name = "email-triage-env"
version = "1.0.0"
sdk = "docker"
inference_file = "inference.py"
